# Reusable moodle-plugin-ci workflow for all Sternfast/Vbounds Moodle plugins.
# A plugin repo calls this with a ~6-line caller (see ci-caller.yml). Fix this ONE file and every
# plugin that points at it inherits the change on its next build — the "update once, all inherit"
# lever. When a new Moodle version ships, add its branch to the matrix below and all plugins are
# tested against it.
name: Moodle Plugin CI (reusable)

on:
  workflow_call:
    inputs:
      # Override the default matrix from a caller if a plugin needs a narrower/wider range.
      matrix-json:
        description: 'Optional JSON array of {php, moodle-branch} objects to replace the default matrix.'
        type: string
        required: false
        default: ''

jobs:
  resolve-matrix:
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ -n "${{ inputs.matrix-json }}" ]; then
            echo "include=${{ inputs.matrix-json }}" >> "$GITHUB_OUTPUT"
          else
            # Default: LTS + the current stable 5.x. Keep PHP paired to each branch's requirement.
            # Only branches that exist and install are listed here; add a new one the week it ships.
            echo 'include=[{"php":"8.2","moodle-branch":"MOODLE_405_STABLE"},{"php":"8.3","moodle-branch":"MOODLE_502_STABLE"}]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: resolve-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.include) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, intl, xmlrpc, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        shell: bash
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle (${{ matrix.moodle-branch }}, pgsql)
        shell: bash
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # The redundant check suite every plugin shares. '|| true' is NOT used — a failure fails CI.
      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint
      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd
      - name: Moodle Code Checker (phpcs)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0
      - name: PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc
      - name: Validate
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate
      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints
      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache
      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt
      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit
      - name: Behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
